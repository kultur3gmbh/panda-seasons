name: Check Panda Seasons Canvas
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: ./tools/check.sh
      - run: node --check panda-seasons/assets/admin.js && node --check panda-seasons-free/assets/admin.js
